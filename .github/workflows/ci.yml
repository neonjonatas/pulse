name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/restore-build

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Setup Corepack
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint
